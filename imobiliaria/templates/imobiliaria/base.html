{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>{% block title %}Morada — encontre seu lugar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'imobiliaria/css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'imobiliaria:inicio' %}" aria-label="Morada, página inicial">
      <span class="brand-mark">m</span><span>morada<span class="brand-period">.</span></span>
    </a>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="{% url 'imobiliaria:inicio' %}#imoveis">Imóveis</a>
      <a href="{% url 'imobiliaria:inicio' %}#sobre">Sobre nós</a>
    </nav>
    <a class="header-cta" href="{% url 'imobiliaria:inicio' %}#imoveis">Encontrar um imóvel <span aria-hidden="true">↗</span></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer" id="sobre">
    <a class="brand footer-brand" href="{% url 'imobiliaria:inicio' %}"><span class="brand-mark">m</span><span>morada<span class="brand-period">.</span></span></a>
    <p>Seu próximo capítulo começa com o lugar certo.</p>
    <span>© {% now "Y" %} Morada Imóveis</span>
  </footer>
</body>
</html>
