{% extends 'imobiliaria/base.html' %}

{% block title %}Imóveis | Imobiliária{% endblock %}

{% block conteudo %}
    <div class="pagina-cabecalho">
        <h1>Imóveis</h1>
        <a href="{% url 'imobiliaria:imovel_novo' %}" class="botao">Novo imóvel</a>
    </div>

    <form method="get" class="filtro-imoveis">
        <select name="status">
            <option value="">Todos os status</option>
            {% for valor, rotulo in status_opcoes %}
                <option value="{{ valor }}" {% if valor == status_selecionado %}selected{% endif %}>{{ rotulo }}</option>
            {% endfor %}
        </select>
        <select name="tipo">
            <option value="">Todos os tipos</option>
            {% for valor, rotulo in tipo_opcoes %}
                <option value="{{ valor }}" {% if valor == tipo_selecionado %}selected{% endif %}>{{ rotulo }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="botao botao--secundario">Filtrar</button>
    </form>

    <div class="imoveis-grade">
        {% for imovel in imoveis %}
            {% include 'imobiliaria/_partials/_imovel-card.html' %}
        {% empty %}
            <p>Nenhum imóvel cadastrado.</p>
        {% endfor %}
    </div>
{% endblock %}
