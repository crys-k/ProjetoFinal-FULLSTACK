{% extends 'imobiliaria/base.html' %}

{% block title %}Login | Imobiliária{% endblock %}

{% block nav_bar %}{% endblock %}

{% block conteudo %}
    <form method="post" class="login-form">
        {% csrf_token %}
        <h1 class="login-form__titulo">Acesso ao Sistema</h1>
        <div class="login-form__campo">
            <label for="username" class="login-form__label">Usuário</label>
            <input type="text" id="username" name="username" class="login-form__input" required autofocus>
        </div>
        <div class="login-form__campo">
            <label for="password" class="login-form__label">Senha</label>
            <input type="password" id="password" name="password" class="login-form__input" required>
        </div>
        <button type="submit" class="login-form__botao">Entrar</button>
    </form>
{% endblock %}
